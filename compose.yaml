services:
  db:
    image: postgres:16
    container_name: asistencia_facial_db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/initdb:/docker-entrypoint-initdb.d

volumes:
  postgres_data: